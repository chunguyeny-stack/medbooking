<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDBOOKING - Đăng ký tài khoản bệnh nhân</title>
</head>
<body>

    <header>
        <div class="logo">MEDBOOKING</div>
        <span>Hotline: 1999 0081</span>
    </header>

    <main>
        <section class="register-form-container">
            <a href="home.html">← Quay lại trang chủ</a>
            <h1>Đăng ký tài khoản dành cho bệnh nhân mới</h1>

            <form action="#" method="POST">
                <div>
                    <label for="hoten">Họ và tên</label>
                    <input type="text" id="hoten" name="hoten" placeholder="Nhập họ và tên" required>
                </div>

                <div>
                    <label for="email">Gmail</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                </div>

                <div>
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                </div>

                <button type="submit">Chấp nhận</button>
            </form>

            <div class="login-redirect">
                <p>Đã có tài khoản? <a href="dn.html">Đăng nhập</a></p>
            </div>
        </section>
    </main>

</body>
</html>
