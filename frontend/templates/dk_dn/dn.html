<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDBOOKING - Đăng nhập</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4fbf7; /* Nền trắng kem ánh xanh lá nhẹ nhàng */
            --text-main: #0f172a;
            --accent-green: #059669; /* Xanh lá tươi sáng, sức sống y tế */
            --accent-green-dark: #047857;
            --accent-purple: #7c3aed; /* Tím hiện đại, sang trọng */
            --accent-purple-deep: #4c1d95;
            --card-bg: #ffffff;
            --border-color: rgba(5, 150, 105, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 6%;
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-green);
            font-style: italic;
        }

        .hotline {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            font-weight: 500;
        }

        /* --- MAIN LAYOUT CHIA ĐÔI THEO MẪU --- */
        .login-container {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            min-height: 100vh;
            width: 100%;
        }

        /* Cột trái: Form đăng nhập trên nền gradient Xanh lá - Tím */
        .login-left-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 120px 8% 60px 10%;
            background: linear-gradient(135deg, #f4fbf7 0%, #ecfdf5 50%, #f3e8ff 100%);
            position: relative;
        }

        .back-home {
            display: inline-block;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 25px;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: var(--accent-green);
        }

        .login-left-side h1 {
            font-family: 'Playfair Display', serif;
            font-size: 46px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .login-left-side h1 i {
            color: var(--accent-purple);
        }

        .login-desc {
            font-size: 15px;
            color: #475569;
            margin-bottom: 35px;
            font-weight: 300;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(5, 150, 105, 0.2);
            background: rgba(255, 255, 255, 0.75);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
            background: #ffffff;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .form-actions a {
            font-size: 13px;
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 500;
        }

        .form-actions a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-purple));
            color: #ffffff;
            padding: 16px;
            border-radius: 50px;
            border: none;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.25);
            transition: transform 0.3s ease, opacity 0.3s ease;
            margin-bottom: 25px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .register-redirect {
            text-align: center;
        }

        .register-redirect p {
            font-size: 14px;
            color: #64748b;
        }

        .register-redirect a {
            color: var(--text-main);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid var(--text-main);
            padding-bottom: 2px;
            transition: color 0.3s, border-color 0.3s;
        }

        .register-redirect a:hover {
            color: var(--accent-purple);
            border-color: var(--accent-purple);
        }

        /* Cột phải: Khung ảnh nghệ thuật tone Xanh - Tím có chiều sâu lượn sóng */
        .login-right-side {
            position: relative;
            overflow: hidden;
            background: #064e3b;
        }

        .login-right-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.92);
        }

        /* Dải chuyển màu mịn màng ngăn cách 2 bên */
        .login-right-side::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 140px;
            height: 100%;
            background: linear-gradient(to right, rgba(244, 251, 247, 1), rgba(244, 251, 247, 0));
            z-index: 2;
        }

        @media (max-width: 968px) {
            .login-container {
                grid-template-columns: 1fr;
            }
            .login-right-side {
                display: none;
            }
            .login-left-side {
                padding: 100px 6% 50px 6%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="logo">MED<span>BOOKING</span></div>
        <div class="hotline">Hotline: 1999 0081</div>
    </header>

    <!-- Main Content Layout -->
    <main class="login-container">
        <!-- Cột trái: Form đăng nhập -->
        <section class="login-left-side">
            <a href="home.html" class="back-home">← Quay lại trang chủ</a>
            <h1>Chào mừng trở lại <i>MedBooking</i></h1>
            <p class="login-desc">Nhập thông tin tài khoản của bạn để tiếp tục tra cứu lịch sử bệnh án và đặt lịch khám bảo mật.</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Gmail</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                </div>

                <div class="form-actions">
                    <a href="#">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-submit">Chấp nhận</button>
            </form>

            <div class="register-redirect">
                <p>Nếu là bệnh nhân chưa có tài khoản? <a href="dk.html">Đăng ký tài khoản bệnh nhân mới</a></p>
            </div>
        </section>

        <!-- Cột phải: Hình ảnh bác sĩ y tế cao cấp tông màu xanh - tím đầy chiều sâu -->
        <div class="login-right-side">
            <img src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=1200&q=80" alt="Bác sĩ chuyên khoa MedBooking">
        </div>
    </main>

</body>
</html>
