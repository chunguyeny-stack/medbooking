<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bác sĩ - Trang chủ</title>
<link rel="stylesheet" href="../../static/css/BS.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-container">
        <div class="logo-icon">
          <i class="fas fa-headset"></i>
        </div>
        <div class="logo-text">
          <h1>MEDBOOKING</h1>
          <p>Bác sĩ</p>
        </div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-title">Tổng quan</div>
      <ul class="nav-list"><li><a href="home_bs.html" class="nav-link"><i class="fas fa-house-medical"></i><span>Trang chủ Bác sĩ</span></a></li></ul>
    </div>
    <div class="nav-section">
      <div class="nav-title">Tác nghiệp khám bệnh</div>
      <ul class="nav-list">
        <li><a href="danh_sach_ca_kham.html" class="nav-link"><i class="fas fa-calendar-check"></i><span>Lịch hẹn & Ca khám</span></a></li>
        <li><a href="ho_so_ca_nhan.html" class="nav-link"><i class="fas fa-user-doctor"></i><span>Hồ sơ & Lịch trực</span></a></li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <div class="avatar-sm">NA</div>
      <div class="info"><strong>BS. Nguyễn Văn A</strong><span>Nội Tổng Quát</span></div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">Tổng quan Bác sĩ</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="theme-toggle"><i class="fas fa-moon"></i><i class="fas fa-sun"></i></button>
        <button class="icon-btn" id="btn-notify"><i class="fas fa-bell"></i><span class="badge"></span></button>
        <div class="user-chip"><div class="avatar">NA</div><span class="name">BS. Nguyễn Văn A</span></div>
      </div>
    </header>

    <main class="content">
      <div class="stats-grid" id="stats-grid"></div>

      <section class="card">
        <div class="card-header">
          <h2 class="card-title"><i class="fas fa-clock"></i> Ca khám sắp tới</h2>
          <a href="danh_sach_ca_kham.html" class="btn btn-outline btn-sm">Xem tất cả <i class="fas fa-arrow-right"></i></a>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr><th>Giờ</th><th>Mã LH</th><th>Bệnh nhân</th><th>Triệu chứng</th><th>Trạng thái</th></tr>
            </thead>
            <tbody id="home-appointments-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../../static/js/bac_si.js"></script>
<script>
window.MB_PAGE_INIT = function () {
  const s = MB_MOCK.stats;
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card stat-green"><div class="icon-bg"><i class="fas fa-stethoscope"></i></div>
      <div class="label">Ca khám hôm nay</div><div class="value">${s.today}</div>
      <div class="trend"><i class="fas fa-arrow-up"></i> +2 so với hôm qua</div></div>
    <div class="stat-card stat-teal"><div class="icon-bg"><i class="fas fa-circle-check"></i></div>
      <div class="label">Đã hoàn thành</div><div class="value">${s.done}</div>
      <div class="trend"><i class="fas fa-clock"></i> Còn ${s.waiting} ca chờ</div></div>
    <div class="stat-card stat-amber"><div class="icon-bg"><i class="fas fa-hourglass-half"></i></div>
      <div class="label">Đang chờ khám</div><div class="value">${s.waiting}</div>
      <div class="trend"><i class="fas fa-user"></i> 3 bệnh nhân mới</div></div>
    <div class="stat-card stat-sky"><div class="icon-bg"><i class="fas fa-calendar-week"></i></div>
      <div class="label">Lịch trực tuần</div><div class="value">${s.weekShifts}</div>
      <div class="trend"><i class="fas fa-sun"></i> Ca sáng & chiều</div></div>
  `;

  const badgeMap = {
    waiting:      ['badge-waiting',   'Chờ khám'],
    'in-progress':['badge-progress',  'Đang khám'],
    completed:    ['badge-completed', 'Đã hoàn thành'],
    cancelled:    ['badge-cancelled', 'Đã hủy']
  };
  const tbody = document.getElementById('home-appointments-body');
  tbody.innerHTML = '';

  MB_MOCK.appointments.slice(0, 3).forEach((a) => {
    const [cls, txt] = badgeMap[a.status] || ['badge-waiting', a.status];
    tbody.innerHTML += `
      <tr>
        <td><strong>${a.time.split(' - ')[0]}</strong></td>
        <td>${a.id}</td>
        <td>${a.name}</td>
        <td>${a.symptom}</td>
        <td><span class="badge-status ${cls}">${txt}</span></td>
      </tr>`;
  });

  document.getElementById('btn-notify').addEventListener('click', () => {
    showToast('Bạn có 5 thông báo mới từ bệnh nhân!', 'info', 2500);
  });
};
</script>
</body>
</html>
