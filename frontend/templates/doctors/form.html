<!-- Đặt lên trên đầu danh sách theo yêu cầu -->
<div id="formModal" style="display:none;position:fixed;top:20%;left:30%;background:white;padding:20px;border-radius:8px;box-shadow:0 0 10px #0002;">
  <h3 id="formTitle">Thêm bác sĩ</h3>
  <form id="docForm">
    <input name="full_name" placeholder="Họ tên" required>
    <input name="specialty" placeholder="Chuyên khoa">
    <textarea name="description" placeholder="Mô tả"></textarea>
    <input type="number" step="0.01" name="price" placeholder="Giá">
    <button type="submit">Lưu</button>
    <button type="button" onclick="closeForm()">Hủy</button>
  </form>
</div>

<script>
let editId = null;
function showAddModal() { editId=null; document.getElementById('formModal').style.display='block'; }
function showEditModal(id) { editId=id; document.getElementById('formTitle').innerText='Sửa thông tin bác sĩ'; /* load dữ liệu */ }

document.getElementById('docForm').onsubmit = async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const method = editId ? 'PUT' : 'POST';
  const url = editId ? `/api/doctors/${editId}` : '/api/doctors/';
  await fetch(url, {method, headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}, body:JSON.stringify(data)});
  location.reload();
};
</script>
