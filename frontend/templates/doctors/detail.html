<h2>{{ doctor.full_name }}</h2>
<p>Chuyên khoa: {{ doctor.specialty }}</p>
<p>Mô tả: {{ doctor.description }}</p>
<p>Giá khám: {{ doctor.price }} VNĐ</p>

{% if doctor.can_edit %}
<button onclick="showEditModal({{doctor.id}})">Cập nhật thông tin</button>
<button onclick="confirmDelete({{doctor.id}})">Xóa bác sĩ</button>
{% endif %}
<button onclick="history.back()">Thoát</button>

<script>
async function confirmDelete(id) {
  const choice = confirm("Chọn kiểu xóa:\nOK = Xóa ẩn\nHủy + OK tiếp = Xóa hẳn");
  let hard = false;
  if (!choice) {
    if (confirm("Bạn có chắc xóa hoàn toàn? Không thể phục hồi!")) hard = true;
    else return;
  }
  await fetch(`/api/doctors/${id}?hard=${hard}`, {method:"DELETE", headers:{"Authorization":`Bearer ${token}`}});
  location.href = "/doctors";
}
</script>
